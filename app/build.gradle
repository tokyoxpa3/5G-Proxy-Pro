plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tokyoxpa3.androidproxy'
    compileSdk 34
    
    defaultConfig {
        applicationId "com.tokyoxpa3.androidproxy"
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName "1.6.1"
        
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    
    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            // minify/shrink disabled for reproducible F-Droid builds
            // (F-Droid CI builds without R8, so this must match)
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 若根目錄存在 keystore.properties 則以正式金鑰簽名（自行發布用），
            // 否則不簽名，供 F-Droid 等第三方使用自己的金鑰簽署。
            def keystoreProps = rootProject.file('keystore.properties')
            if (keystoreProps.exists()) {
                def props = new Properties()
                keystoreProps.withInputStream { props.load(it) }
                signingConfigs.create('release') {
                    storeFile file(props['storeFile'])
                    storePassword props['storePassword']
                    keyAlias props['keyAlias']
                    keyPassword props['keyPassword']
                }
                signingConfig signingConfigs.release
            }
        }
    }
    
    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }
    
    ndkVersion "26.3.11579264"

    dependenciesInfo {
        // don't embed dependency metadata signing block; F-Droid scanner rejects it
        includeInApk = false
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    testImplementation 'junit:junit:4.13.2'
}

// [原生協定測試] 用 host C 編譯器編譯並執行純 SOCKS5 協定解析的單元測試。
// socks5_protocol.c 零 Android/JNI/socket 依賴，可在 CI(Linux gcc) 與開發機(MinGW) 直接跑。
// 找不到編譯器時以警告跳過（不影響無工具鏈環境的一般建置）。
def cprotoCc = ['cc', 'gcc', 'clang'].find { c ->
    try { new ProcessBuilder(c, '--version').redirectErrorStream(true).start().waitFor() == 0 }
    catch (Exception e) { false }
}

tasks.register('cProtocolTest') {
    group = 'verification'
    description = 'Compile and run pure C unit tests (SOCKS5 protocol + conn state) on the host C compiler.'
    onlyIf {
        if (cprotoCc == null) {
            logger.warn('cProtocolTest skipped: no C compiler (cc/gcc/clang) found')
            return false
        }
        return true
    }
    doLast {
        // 每個純函式模組的來源與其 host 測試二進位（全部零 Android/JNI/socket 依賴）
        def targets = [
            [name: 'socks5_protocol_test',
             srcs: ['src/main/cpp/socks5_protocol.c',
                    'src/test/cpp/socks5_protocol_test.c']],
            [name: 'conn_state_test',
             srcs: ['src/main/cpp/conn_state.c',
                    'src/test/cpp/conn_state_test.c']],
        ]
        targets.each { t ->
            def srcs = t.srcs.collect { file(it).absolutePath }
            def out = new File("${buildDir}/tmp/cproto/${t.name}")
            out.parentFile.mkdirs()
            project.exec {
                commandLine([cprotoCc, '-std=c11', '-Wall', '-Wextra',
                    '-I', file('src/main/cpp').absolutePath,
                    '-o', out.absolutePath] + srcs)
            }
            project.exec {
                commandLine out.absolutePath
            }
        }
    }
}

// 讓既有 `./gradlew test` 一併執行原生協定測試（CI 的 release 前測試步驟會自動涵蓋）。
// 用 configureEach 延後綁定：AGP 的 `test` 生命週期任務在 android 區塊評估後才註冊，
// 太早用 tasks.named('test') 會在此時點查無此任務而失敗。
tasks.configureEach {
    if (name == 'test') {
        dependsOn 'cProtocolTest'
    }
}