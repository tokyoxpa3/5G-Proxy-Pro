name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          # Do not use android-actions/setup-android@v3 here: it runs
          # `sdkmanager tools`, and the `tools` package was removed from the SDK
          # repository, so the action now fails with "Failed to find package
          # 'tools'" on the current runner image. The image already ships an
          # Android SDK, so just wire its cmdline-tools onto PATH.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CT_BIN="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -n "$CT_BIN" ]; then
            echo "$CT_BIN" >> "$GITHUB_PATH"
          fi

      - name: Install NDK and build-tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.3.11579264" "build-tools;34.0.0" "platforms;android-34"

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          printf 'storeFile=../keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > keystore.properties
          ls -la keystore.jks keystore.properties
          cat keystore.properties | sed 's/storePassword=.*/storePassword=***/;s/keyPassword=.*/keyPassword=***/'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build release notes from commits
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREV" ]; then
              git log "$PREV..$TAG" --no-merges --pretty='- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))'
            else
              git log -1 --pretty='- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))'
            fi
            echo
            echo "Signed APK attached below (reproducible F-Droid build)."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" "5G-Proxy-Pro-${TAG}.apk"
          gh release create "$TAG" --title "$TAG" --target "${GITHUB_SHA}" --notes-file RELEASE_NOTES.md 2>/dev/null || \
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" "5G-Proxy-Pro-${TAG}.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}