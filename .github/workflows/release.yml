name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install NDK and build-tools
        run: |
          sdkmanager "ndk;26.3.11579264" "build-tools;34.0.0" "platforms;android-34"
          yes | sdkmanager --licenses

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          printf 'storeFile=../keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > keystore.properties
          ls -la keystore.jks keystore.properties
          cat keystore.properties | sed 's/storePassword=.*/storePassword=***/;s/keyPassword=.*/keyPassword=***/'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          gh release upload "$TAG" "$APK" --clobber
        env:
          GH_TOKEN: ${{ github.token }}