plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// [Tailnet 中繼] 獨立 APK（獨立 UID）：Android 的 per-app VPN 以 UID 為單位，
// 主程式必須排除在 Tailscale 之外才能走蜂巢式出口，但排除後又收不到 tun0 進來的連線。
// 本 App 留在 Tailscale 內，把 tailnet 進來的 TCP 轉送到主程式的 127.0.0.1 監聽。
android {
    namespace 'com.tokyoxpa3.androidproxy.relay'
    compileSdk 34

    defaultConfig {
        applicationId "com.tokyoxpa3.androidproxy.relay"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // 與主程式共用 keystore.properties（CI 的 Restore keystore 步驟產生）；
            // 沒有該檔案時輸出未簽名 APK
            def keystoreProps = rootProject.file('keystore.properties')
            if (keystoreProps.exists()) {
                def props = new Properties()
                keystoreProps.withInputStream { props.load(it) }
                signingConfigs.create('release') {
                    storeFile file(props['storeFile'])
                    storePassword props['storePassword']
                    keyAlias props['keyAlias']
                    keyPassword props['keyPassword']
                }
                signingConfig signingConfigs.release
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
